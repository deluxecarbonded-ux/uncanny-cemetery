<!DOCTYPE html>
<html lang="en" data-theme="monochrome-dark" data-theme-variant="dark" data-sharp="false">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <style>
    @font-face {
      font-family: "Exotic Sans";
      src: url("./exotic-sans-regular.otf") format("opentype");
      font-weight: 100 900;
      font-style: normal;
    }

    /* ── Monochrome Dark ── */
    html[data-theme="monochrome-dark"][data-theme-variant="dark"] {
      --bg: #000000;
      --surface: #121212;
      --surface-hover: #1c1c1c;
      --surface-pill: #191919;
      --fg: #ffffff;
      --fg-muted: #9a9a9a;
      --fg-subtle: #666666;
      --invert-bg: #ffffff;
      --invert-fg: #000000;
      --r: 12px;
      --r-sm: 8px;
      color-scheme: dark;
    }
    html[data-theme="monochrome-dark"][data-theme-variant="light"] {
      --bg: #f5f5f5;
      --surface: #eaeaea;
      --surface-hover: #dcdcdc;
      --surface-pill: #dfdfdf;
      --fg: #000000;
      --fg-muted: #555555;
      --fg-subtle: #828282;
      --invert-bg: #000000;
      --invert-fg: #ffffff;
      color-scheme: light;
    }

    /* ── Monochrome Light ── */
    html[data-theme="monochrome-light"][data-theme-variant="light"] {
      --bg: #ffffff;
      --surface: #f2f2f2;
      --surface-hover: #e7e7e7;
      --surface-pill: #e9e9e9;
      --fg: #000000;
      --fg-muted: #555555;
      --fg-subtle: #828282;
      --invert-bg: #000000;
      --invert-fg: #ffffff;
      color-scheme: light;
    }
    html[data-theme="monochrome-light"][data-theme-variant="dark"] {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-hover: #1c1c1c;
      --surface-pill: #191919;
      --fg: #ffffff;
      --fg-muted: #9a9a9a;
      --fg-subtle: #666666;
      --invert-bg: #ffffff;
      --invert-fg: #000000;
      color-scheme: dark;
    }

    /* ── Ocean ── */
    html[data-theme="ocean"][data-theme-variant="dark"] {
      --bg: #0f4c75;
      --surface: #16324f;
      --surface-hover: #1e3a5f;
      --surface-pill: #1b3959;
      --fg: #e8f1f5;
      --fg-muted: #a8c3d9;
      --fg-subtle: #6e8ea0;
      --invert-bg: #e8f1f5;
      --invert-fg: #0f4c75;
      --r: 12px;
      --r-sm: 8px;
      color-scheme: dark;
    }
    html[data-theme="ocean"][data-theme-variant="light"] {
      --bg: #e8f1f5;
      --surface: #c9e3ee;
      --surface-hover: #b8d8e6;
      --surface-pill: #c2dded;
      --fg: #0f4c75;
      --fg-muted: #4a7a9e;
      --fg-subtle: #7a9fb3;
      --invert-bg: #0f4c75;
      --invert-fg: #e8f1f5;
      color-scheme: light;
    }

    /* ── Sunset ── */
    html[data-theme="sunset"][data-theme-variant="light"] {
      --bg: #fdfbfb;
      --surface: #ead2ac;
      --surface-hover: #dec994;
      --surface-pill: #e5cb9e;
      --fg: #c06c84;
      --fg-muted: #a05c6f;
      --fg-subtle: #b08e99;
      --invert-bg: #c06c84;
      --invert-fg: #fdfbfb;
      --r: 12px;
      --r-sm: 8px;
      color-scheme: light;
    }
    html[data-theme="sunset"][data-theme-variant="dark"] {
      --bg: #c06c84;
      --surface: #a64d79;
      --surface-hover: #9a3d6d;
      --surface-pill: #9e4370;
      --fg: #fdfbfb;
      --fg-muted: #ead2ac;
      --fg-subtle: #c0a080;
      --invert-bg: #fdfbfb;
      --invert-fg: #c06c84;
      color-scheme: dark;
    }

    /* ── Forest ── */
    html[data-theme="forest"][data-theme-variant="dark"] {
      --bg: #1b4332;
      --surface: #2d6a4f;
      --surface-hover: #3a845e;
      --surface-pill: #337556;
      --fg: #d8f3dc;
      --fg-muted: #a8d8b9;
      --fg-subtle: #7aa889;
      --invert-bg: #d8f3dc;
      --invert-fg: #1b4332;
      --r: 12px;
      --r-sm: 8px;
      color-scheme: dark;
    }
    html[data-theme="forest"][data-theme-variant="light"] {
      --bg: #d8f3dc;
      --surface: #b9e3ca;
      --surface-hover: #a9d8be;
      --surface-pill: #b2dcb8;
      --fg: #1b4332;
      --fg-muted: #4a7a66;
      --fg-subtle: #7a9b89;
      --invert-bg: #1b4332;
      --invert-fg: #d8f3dc;
      color-scheme: light;
    }

    /* ── Midnight ── */
    html[data-theme="midnight"][data-theme-variant="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --surface-pill: #263348;
      --fg: #f8fafc;
      --fg-muted: #94a3b8;
      --fg-subtle: #64748b;
      --invert-bg: #f8fafc;
      --invert-fg: #0f172a;
      --r: 12px;
      --r-sm: 8px;
      color-scheme: dark;
    }
    html[data-theme="midnight"][data-theme-variant="light"] {
      --bg: #f8fafc;
      --surface: #e2e8f0;
      --surface-hover: #cbd5e1;
      --surface-pill: #d8dee6;
      --fg: #0f172a;
      --fg-muted: #64748b;
      --fg-subtle: #94a3b8;
      --invert-bg: #0f172a;
      --invert-fg: #f8fafc;
      color-scheme: light;
    }

    html[data-sharp="true"] {
      --r: 0px !important;
      --r-sm: 0px !important;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Exotic Sans", "Segoe UI", Arial, sans-serif !important;
      font-weight: 400 !important;
      font-synthesis: none !important;
      letter-spacing: 0 !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background-image: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .nt-page {
      min-height: 100vh;
      max-width: 880px;
      margin: 0 auto;
      padding: 26px 34px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
    }

    .nt-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nt-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      color: var(--fg);
    }

    .nt-top-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nt-pill-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: var(--r-sm);
      background-color: var(--surface);
      color: var(--fg-muted);
      font-size: 12.5px;
      cursor: pointer;
    }

    .nt-pill-btn:hover,
    .nt-pill-btn[data-active="true"] {
      background-color: var(--invert-bg);
      color: var(--invert-fg);
    }

    .nt-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
      margin-bottom: 4vh;
    }

    .nt-time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .nt-clock {
      font-size: 58px;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }

    .nt-date {
      font-size: 13.5px;
      color: var(--fg-muted);
    }

    .nt-search-bar {
      width: 100%;
      max-width: 620px;
      height: 50px;
      border-radius: var(--r);
      background-color: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 0 16px;
    }

    .nt-search-bar:focus-within {
      background-color: var(--surface-hover);
    }

    .nt-search-ico {
      color: var(--fg-muted);
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .nt-search-input {
      flex: 1;
      height: 100%;
      background-color: transparent;
      color: var(--fg);
      font-size: 14.5px;
    }

    .nt-search-input::placeholder {
      color: var(--fg-subtle);
    }

    .nt-search-go {
      height: 34px;
      padding: 0 16px;
      border-radius: var(--r-sm);
      background-color: var(--invert-bg);
      color: var(--invert-fg);
      font-size: 12.5px;
      cursor: pointer;
    }

    .nt-pins {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .nt-pin-card {
      padding: 16px 10px 14px;
      border-radius: var(--r);
      background-color: var(--surface);
      color: var(--fg);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .nt-pin-card:hover {
      background-color: var(--surface-hover);
    }

    .nt-pin-glyph {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background-color: var(--surface-pill);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nt-pin-title {
      font-size: 12.5px;
      color: var(--fg);
    }

    .nt-spacer {
      height: 12px;
    }

    @media (max-width: 760px) {
      .nt-pins {
        grid-template-columns: repeat(3, 1fr);
      }
      .nt-clock {
        font-size: 46px;
      }
    }
  </style>
</head>
<body>
  <main class="nt-page">
    <header class="nt-top">
      <div class="nt-brand">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="26" height="26" rx="6" fill="var(--invert-bg)"/>
          <rect x="7" y="6.8" width="14" height="2.6" fill="var(--invert-fg)"/>
          <rect x="7" y="12.7" width="10.5" height="2.6" fill="var(--invert-fg)"/>
          <rect x="18.4" y="12.7" width="2.6" height="2.6" fill="var(--invert-fg)"/>
          <rect x="7" y="18.6" width="14" height="2.6" fill="var(--invert-fg)"/>
          <rect x="7" y="6.8" width="2.8" height="8.5" fill="var(--invert-fg)"/>
          <rect x="7" y="16.8" width="2.8" height="4.4" fill="var(--invert-fg)"/>
        </svg>
        <span>Exotic</span>
      </div>

      <div class="nt-top-actions">
        <button class="nt-pill-btn" type="button" data-route="exotic://bookmarks">Bookmarks</button>
        <button class="nt-pill-btn" id="btn-mods" type="button">Exotic Mods</button>
        <button class="nt-pill-btn" type="button" data-route="exotic://settings">Settings</button>
        <button class="nt-pill-btn" id="btn-dark" type="button" data-active="true">Dark</button>
        <button class="nt-pill-btn" id="btn-light" type="button" data-active="false">Light</button>
      </div>
    </header>

    <section class="nt-center">
      <div class="nt-time-block">
        <div class="nt-clock" id="nt-clock">00:00</div>
        <div class="nt-date" id="nt-date"></div>
      </div>

      <form class="nt-search-bar" id="nt-search-form" autocomplete="off">
        <span class="nt-search-ico">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.5 10.5L13.6 13.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          id="nt-query"
          class="nt-search-input"
          type="text"
          placeholder="Search with DuckDuckGo or enter address"
          autofocus
        />
        <button class="nt-search-go" type="submit">Search</button>
      </form>

      <div class="nt-pins">
        <a class="nt-pin-card" href="https://duckduckgo.com/">
          <span class="nt-pin-glyph">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.4"/>
              <path d="M10.5 10.5L13.6 13.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nt-pin-title">DuckDuckGo</span>
        </a>
        <a class="nt-pin-card" href="https://github.com/">
          <span class="nt-pin-glyph">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <path d="M5.5 4.5L2.5 8l3 3.5M10.5 4.5l3 3.5-3 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="nt-pin-title">GitHub</span>
        </a>
        <a class="nt-pin-card" href="https://www.wikipedia.org/">
          <span class="nt-pin-glyph">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2.7 8h10.6M8 2.5c1.8 1.6 1.8 9.4 0 11M8 2.5c-1.8 1.6-1.8 9.4 0 11" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </span>
          <span class="nt-pin-title">Wikipedia</span>
        </a>
        <button class="nt-pin-card" type="button" data-route="exotic://bookmarks">
          <span class="nt-pin-glyph">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <path d="M4.5 2.8h7a1 1 0 0 1 1 1v9.4L8 10.6l-4.5 2.6V3.8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="nt-pin-title">Bookmarks</span>
        </button>
        <button class="nt-pin-card" type="button" data-route="exotic://mods">
          <span class="nt-pin-glyph">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <path d="M3 5h10M3 11h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="6" cy="5" r="1.6" fill="currentColor"/>
              <circle cx="10" cy="11" r="1.6" fill="currentColor"/>
            </svg>
          </span>
          <span class="nt-pin-title">Exotic Mods</span>
        </button>
        <button class="nt-pin-card" type="button" data-route="exotic://settings">
          <span class="nt-pin-glyph">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="8" cy="8" r="5.4" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 1.8"/>
            </svg>
          </span>
          <span class="nt-pin-title">Settings</span>
        </button>
      </div>
    </section>

    <div class="nt-spacer"></div>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const btnDark = document.getElementById("btn-dark");
      const btnLight = document.getElementById("btn-light");
      const btnMods = document.getElementById("btn-mods");

      const THEMES = ["monochrome-dark", "monochrome-light", "ocean", "sunset", "forest", "midnight"];
      const DARK_THEMES = ["monochrome-dark", "ocean", "forest", "midnight"];
      const LIGHT_THEMES = ["monochrome-light", "sunset"];

      function isDarkTheme(name) {
        return DARK_THEMES.includes(name);
      }

      function variantFor(theme, wantDark) {
        if (wantDark) {
          return DARK_THEMES.includes(theme) ? theme : (LIGHT_THEMES.includes(theme) ? theme + "-dark" : theme);
        }
        return LIGHT_THEMES.includes(theme) ? theme : (DARK_THEMES.includes(theme) ? theme + "-light" : theme);
      }

      function resolveTheme() {
        const stored = root.getAttribute("data-theme") || "monochrome-dark";
        const variant = root.getAttribute("data-theme-variant") || (isDarkTheme(stored) ? "dark" : "light");
        return { theme: stored, variant: variant };
      }

      function syncThemeButtons() {
        const { variant } = resolveTheme();
        btnDark.setAttribute("data-active", variant === "dark" ? "true" : "false");
        btnLight.setAttribute("data-active", variant === "light" ? "true" : "false");
      }

      const obs = new MutationObserver(syncThemeButtons);
      obs.observe(root, { attributes: true, attributeFilter: ["data-theme", "data-theme-variant"] });

      const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
      function syncFromSystemScheme() {
        if (!mq || root.getAttribute("data-exotic-managed") === "true") return;
        const wantLight = mq.matches;
        const { theme } = resolveTheme();
        const nextVariant = wantLight ? "light" : "dark";
        root.setAttribute("data-theme-variant", nextVariant);
        if (wantLight && DARK_THEMES.includes(theme)) {
          const lightAlt = { "monochrome-dark": "monochrome-light", "ocean": "ocean-light", "forest": "forest-light", "midnight": "midnight-light" }[theme];
          if (lightAlt) root.setAttribute("data-theme", lightAlt);
        } else if (!wantLight && LIGHT_THEMES.includes(theme)) {
          const darkAlt = { "monochrome-light": "monochrome-dark", "sunset": "sunset-dark" }[theme];
          if (darkAlt) root.setAttribute("data-theme", darkAlt);
        }
        syncThemeButtons();
      }
      if (mq) {
        syncFromSystemScheme();
        if (mq.addEventListener) mq.addEventListener("change", syncFromSystemScheme);
      }
      syncThemeButtons();

      function applyTheme(themeName, variant) {
        root.setAttribute("data-theme", themeName);
        root.setAttribute("data-theme-variant", variant);
        syncThemeButtons();
        window.dispatchEvent(new CustomEvent("ExoticSetTheme", {
          detail: themeName,
          bubbles: true
        }));
        window.dispatchEvent(new CustomEvent("ExoticSetThemeVariant", {
          detail: variant,
          bubbles: true
        }));
      }

      btnDark.addEventListener("click", () => {
        const { theme } = resolveTheme();
        applyTheme(theme, "dark");
      });
      btnLight.addEventListener("click", () => {
        const { theme } = resolveTheme();
        applyTheme(theme, "light");
      });
      btnMods.addEventListener("click", () => {
        window.dispatchEvent(new CustomEvent("ExoticOpenMods", { bubbles: true }));
      });

      for (const routeBtn of document.querySelectorAll("[data-route]")) {
        routeBtn.addEventListener("click", () => {
          const r = routeBtn.getAttribute("data-route");
          window.dispatchEvent(new CustomEvent("ExoticNavigate", { detail: r, bubbles: true }));
        });
      }

      function tickClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("nt-clock").textContent = hh + ":" + mm;
        document.getElementById("nt-date").textContent = now.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });
      }
      tickClock();
      setInterval(tickClock, 10000);

      document.getElementById("nt-search-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const raw = document.getElementById("nt-query").value.trim();
        if (!raw) return;
        if (/^exotic:\/\//i.test(raw)) {
          window.dispatchEvent(new CustomEvent("ExoticNavigate", { detail: raw, bubbles: true }));
          return;
        }
        const looksUrl = /^(https?:\/\/)/i.test(raw) || (!raw.includes(" ") && raw.includes("."));
        if (looksUrl) {
          window.location.href = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
        } else {
          window.location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(raw);
        }
      });
    })();
  </script>
</body>
</html>
