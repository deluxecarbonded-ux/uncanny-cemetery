    "exotic.mods.sharpGeometry",
    "exotic.mods.ghostTabs",
    "exotic.mods.distractionScrubber",
  ];

  function getModBool(pref, defVal = false) {
    try {
      return Services.prefs.getBoolPref(pref);
    } catch (_) {
      return defVal;
    }
  }

  function getModChar(pref, defVal = "") {
    try {
      return Services.prefs.getCharPref(pref) || defVal;
    } catch (_) {
      return defVal;
    }
  }

  function countEnabledMods() {
    let n = 0;
    for (const k of MOD_PREF_KEYS) {
      if (getModBool(k, false)) n++;
    }
    return n;
  }

  function syncAllWindows() {
    for (const syncFn of exoticState.windowSyncHooks) {
      try {
        syncFn();
      } catch (_) {}
    }
  }

  function syncExoticMods() {
    try {
      const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(
        Ci.nsIStyleSheetService
      );
      if (
        exoticState.activeModsSheetURI &&
        sss.sheetRegistered(exoticState.activeModsSheetURI, sss.USER_SHEET)
      ) {
        sss.unregisterSheet(exoticState.activeModsSheetURI, sss.USER_SHEET);
        exoticState.activeModsSheetURI = null;
      }

      const rules = [];
      if (exoticState.shieldEnabled) {
        // Narrow cosmetic ad-bait suppression (never touches site UI, images, or icons)
        rules.push(
          ".adsbox.ad-banner, .ad-placement.pub_300x250, #ads-advert-banner, .adsbox.text-ad.textAd { display: none !important; height: 0 !important; width: 0 !important; }"
        );
      }
      if (getModBool("exotic.mods.monochromeWeb", false)) {
        rules.push("html { filter: grayscale(100%); }");
      }
      if (getModBool("exotic.mods.annoyanceZapper", false)) {
        rules.push(
          "#onetrust-consent-sdk, #CybotCookiebotDialog, .fc-consent-root, #cookie-law-info-bar { display: none !important; }"
        );
      }
      if (getModBool("exotic.mods.distractionScrubber", false)) {
        rules.push(
          "ytd-rich-shelf-renderer[is-shorts], ytd-reel-shelf-renderer, #intercom-container, #drift-widget-container, #hubspot-messages-iframe-container { display: none !important; }"
        );
      }

      const docBlocks = [];
      if (rules.length > 0) {
        docBlocks.push(
          `@-moz-document url-prefix("http://"), url-prefix("https://") {\n${rules.join(
            "\n"
          )}\n}`
        );
      }

      if (getModBool("exotic.mods.hideDiscordServers", false)) {
        docBlocks.push(`@-moz-document domain("discord.com"), domain("discordapp.com") {
  :root,
  html,
  body,
  #app-mount,
  [class*="visual-refresh"],
  [class*="refresh-fast-follow"],
  [class*="density-"],
  [class*="app_"],
  [class*="base_"],
  [class*="sidebar_"] {
    --custom-guild-list-width: 0px !important;
  }

  nav[aria-label="Servers sidebar"],
  nav[class*="guilds_"],
  nav[class*="guilds-"],
  [class*="wrapper_"][class*="guilds_"],
  [class*="wrapper-"][class*="guilds-"],
  nav:has([data-list-id="guildsnav"]),
  [data-list-id="guildsnav"] {
    display: none !important;
    visibility: hidden !important;
    width: 0px !important;
    min-width: 0px !important;
    max-width: 0px !important;
    height: 0px !important;
    min-height: 0px !important;
    margin: 0px !important;
    padding: 0px !important;
    border: 0px !important;
    flex: 0 0 0px !important;
    overflow: hidden !important;
    pointer-events: none !important;
  }

  [class*="base_"]:has([class*="sidebar_"]) {
    grid-template-columns: [start] 0px [guildsEnd] min-content [channelsEnd] 1fr [end] !important;
    left: 0px !important;
    margin-inline-start: 0px !important;
  }

  [class*="sidebar_"]:has([class*="sidebarList_"]):not([data-collapsed="true"]) {
    width: fit-content !important;
    min-width: 0px !important;
  }

  [class*="sidebar_"]:not([data-collapsed="true"]) > [class*="sidebarList_"] {
    width: clamp(240px, calc(var(--custom-guild-sidebar-width, 312px) - 72px), 420px) !important;
    margin-inline-start: 0px !important;
    border-inline-start: none !important;
    border-start-start-radius: 0px !important;
  }

  [class*="sidebarListRounded_"] {
    border-start-start-radius: 0px !important;
  }

  [class*="sidebar_"]::after {
    display: none !important;
    width: 0px !important;
  }

  [class*="sidebar_"] > section[class*="panels_"],
  [class*="sidebar_"] > section[aria-label="User area"] {
    inset-inline-start: var(--custom-panels-spacing, 8px) !important;
    inset-inline-end: var(--custom-panels-spacing, 8px) !important;
    width: auto !important;
    max-width: calc(100% - var(--custom-panels-spacing, 8px) * 2) !important;
  }

  [class*="backForwardButtons_"] {
    min-width: 0px !important;
  }
}`);
      }

      if (docBlocks.length > 0) {
        const cssDoc = docBlocks.join("\n\n");
        const uri = Services.io.newURI(
          "data:text/css;charset=utf-8," + encodeURIComponent(cssDoc)
        );
        sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
        exoticState.activeModsSheetURI = uri;
      }

      // Reduce page animations via standard W3C prefers-reduced-motion (never strips images)
      const reduceMotion = getModBool("exotic.mods.reducedMotion", false);
      if (reduceMotion) {
        Services.prefs.setIntPref("ui.prefersReducedMotion", 1);
      } else if (Services.prefs.prefHasUserValue("ui.prefersReducedMotion")) {
        Services.prefs.clearUserPref("ui.prefersReducedMotion");
      }

      // WebRTC zero-IP-leak protection (preserves native RTCPeerConnection class while exposing 0 IPs)
      const cloak = getModBool("exotic.mods.webrtcCloak", true);
      Services.prefs.setBoolPref("media.peerconnection.enabled", true);
      Services.prefs.setBoolPref("beacon.enabled", false);
      Services.prefs.setBoolPref("media.peerconnection.ice.default_address_only", cloak);
      Services.prefs.setBoolPref("media.peerconnection.ice.no_host", cloak);
      Services.prefs.setBoolPref("media.peerconnection.ice.proxy_only_if_behind_proxy", cloak);
      Services.prefs.setBoolPref("media.peerconnection.ice.relay_only", cloak);
      Services.prefs.setBoolPref("media.peerconnection.ice.obfuscate_host_addresses", cloak);
      const maskGl = getModBool("exotic.privacy.maskWebgl", true);
      Services.prefs.setBoolPref("webgl.enable-debug-renderer-info", !maskGl);

      // Sync native website default light/dark mode when enabled in Exotic Mods
      syncWebsiteThemeEngine();
    } catch (_) {}

    syncAllWindows();
  }

  function getThemeMode() {
    const envOverride = Services.env.get("EXOTIC_TEST_THEME");
    if (envOverride === "light" || envOverride === "dark") {
      return envOverride;
    }
    try {
      const m = Services.prefs.getCharPref("exotic.theme.mode", "dark");
      return m === "light" ? "light" : "dark";
    } catch (_) {
      return "dark";
    }
  }

  function setHttpsLaxCookie(host, name, value, expiryMs) {
    Services.cookies.add(
      host,
      "/",
      name,
      value,
      true,
      false,
      false,
      expiryMs,
      {},
      Ci.nsICookie.SAMESITE_LAX,
      Ci.nsICookie.SCHEME_HTTPS,
      false
    );
  }

  function getHostCookieValue(baseHost, cookieName) {
    try {
      const list = Services.cookies.getCookiesFromHost(baseHost, {});
      for (const c of list) {
        if (c && c.name === cookieName && c.host.endsWith(baseHost)) {
          return c.value || "";
        }
      }
    } catch (_) {}
    return "";
  }

  function syncSiteThemeCookies(syncWeb, isDarkUi) {
    const oneYearExpiry = Date.now() + 31536000000;
    const expiredTs = Date.now() - 86400000;
    const wasManaged =
      !!exoticState.managedSiteCookies ||
      getModBool("exotic.mods.managedSiteCookies", false);

    // 1. YouTube (.youtube.com PREF f6=400 dark / f6=80000 light)
    try {
      const existingYt = getHostCookieValue("youtube.com", "PREF");
      if (!syncWeb) {
        if (wasManaged && existingYt && existingYt.includes("f6=")) {
          const restored = existingYt
            .split("&")
            .filter((p) => p && !p.startsWith("f6="))
            .join("&");
          setHttpsLaxCookie(
            ".youtube.com",
            "PREF",
            restored,
            restored ? oneYearExpiry : expiredTs
          );
        }
      } else {
        const parts = existingYt
          ? existingYt.split("&").filter((p) => p && !p.startsWith("f6="))
          : [];
        parts.push(isDarkUi ? "f6=400" : "f6=80000");
        setHttpsLaxCookie(".youtube.com", "PREF", parts.join("&"), oneYearExpiry);
      }
    } catch (_) {}

    // 2. Bing (.bing.com SRCHHPGUSR WEBTHEME=1 dark / WEBTHEME=0 light / WEBTHEME=2 system)
    try {
      const existingBing = getHostCookieValue("bing.com", "SRCHHPGUSR");
      if (!syncWeb) {
        if (wasManaged && existingBing) {
          const parts = existingBing
            .split("&")
            .filter(
              (p) =>
                p && !p.startsWith("WEBTHEME=") && !p.startsWith("PREFCOL=")
            );
          parts.push("WEBTHEME=2");
          setHttpsLaxCookie(".bing.com", "SRCHHPGUSR", parts.join("&"), oneYearExpiry);
        }
      } else {
        const parts = existingBing
          ? existingBing
              .split("&")
              .filter(
                (p) =>
                  p && !p.startsWith("WEBTHEME=") && !p.startsWith("PREFCOL=")
              )
          : [];
        const bVal = isDarkUi ? "1" : "0";
        parts.push(`WEBTHEME=${bVal}`, `PREFCOL=${bVal}`);
        setHttpsLaxCookie(".bing.com", "SRCHHPGUSR", parts.join("&"), oneYearExpiry);
      }
    } catch (_) {}

    exoticState.managedSiteCookies = !!syncWeb;
    try {
      Services.prefs.setBoolPref("exotic.mods.managedSiteCookies", !!syncWeb);
    } catch (_) {}
  }

  function syncWebsiteThemeEngine() {
    const uiTheme = getThemeMode();
    const isDarkUi = uiTheme === "dark";
    const syncWeb = getModBool("exotic.mods.syncWebsiteTheme", false);
    const sharp = getModBool("exotic.mods.sharpGeometry", false);

    // Pure native W3C prefers-color-scheme on websites:
    // - When "Website light and dark mode" is ON -> 0 (website's original dark mode) or 1 (website's original light mode)
    // - When OFF -> 2 (system/website default, completely untouched by Exotic's UI theme button)
    try {
      Services.prefs.setIntPref(
        "layout.css.prefers-color-scheme.content-override",
        syncWeb ? (isDarkUi ? 0 : 1) : 2
      );
      if (Services.prefs.prefHasUserValue("browser.theme.content-theme")) {
        Services.prefs.clearUserPref("browser.theme.content-theme");
      }
      if (Services.prefs.prefHasUserValue("ui.systemUsesDarkTheme")) {
        Services.prefs.clearUserPref("ui.systemUsesDarkTheme");
      }
    } catch (_) {}

    syncSiteThemeCookies(syncWeb, isDarkUi);

    const uiPayload = {
      uiTheme,
      sharp,
      syncWebsiteTheme: syncWeb,
      liveTranscriber: getModBool("exotic.mods.liveTranscriber", false),
      liveTranscriberToLang: getModChar("exotic.mods.liveTranscriberToLang", "en"),
      liveTranscriberEngine: getModChar("exotic.mods.liveTranscriberEngine", "parakeet-whisper"),
      chPlatform: EXOTIC_CH_PLATFORM,
      chPlatformVer: EXOTIC_CH_PLATFORM_VER,
      chArch: EXOTIC_CH_ARCH,
      exoticUA: EXOTIC_UA,
    };

    try {
      Services.ppmm.sharedData.set("exotic/uiState", uiPayload);
      Services.ppmm.sharedData.flush();
    } catch (_) {}

    try {
      const visitBC = (bc) => {
        if (!bc) return;
        try {
          const wg = bc.currentWindowGlobal;
          if (wg) {
            const actor = wg.getActor("ExoticWebsiteTheme");
            if (actor) {
              actor.sendAsyncMessage("Exotic:SyncInternalPage", uiPayload);
            }
          }
        } catch (_) {}
        try {
          const kids = bc.children || [];
          for (const child of kids) {
            visitBC(child);
          }
        } catch (_) {}
      };

      const winEnum = Services.wm.getEnumerator("navigator:browser");
      while (winEnum.hasMoreElements()) {
        const win = winEnum.getNext();
        if (!win) continue;
        // Never set DevTools browsingContext.prefersColorSchemeOverride on chrome
        // or tab browsingContexts: Gecko's layout.css.prefers-color-scheme.content-override
        // (0 = dark, 1 = light, 2 = system/website default) updates CSS media queries,
        // HTML <picture> sources, embedded <img src="*.svg"> vector logos/icons, and
        // newly opened tabs atomically without desyncing imgLoader's SVG cache or
        // leaking theme overrides when "Website light and dark mode" is OFF.
        try {
          if (
            win.browsingContext &&
            !win.browsingContext.parent &&
            win.browsingContext.prefersColorSchemeOverride &&
            win.browsingContext.prefersColorSchemeOverride !== "none"
          ) {
            win.browsingContext.prefersColorSchemeOverride = "none";
          }
        } catch (_) {}
        const browsers = (win.gBrowser && win.gBrowser.browsers) || [];
        for (const br of browsers) {
          if (br && br.browsingContext) {
            try {
              if (
                br.browsingContext.prefersColorSchemeOverride &&
                br.browsingContext.prefersColorSchemeOverride !== "none"
              ) {
                br.browsingContext.prefersColorSchemeOverride = "none";
              }
            } catch (_) {}
            visitBC(br.browsingContext);
          }
        }
        try {
          const prevBr =
            win.document && win.document.querySelector(".ex-preview-browser");
          if (prevBr && prevBr.browsingContext) {
            try {
              if (
                prevBr.browsingContext.prefersColorSchemeOverride &&
                prevBr.browsingContext.prefersColorSchemeOverride !== "none"
              ) {
                prevBr.browsingContext.prefersColorSchemeOverride = "none";
              }
            } catch (_) {}
            visitBC(prevBr.browsingContext);
          }
        } catch (_) {}
      }
    } catch (_) {}
  }

  function applyExoticTheme(mode) {
    const next = mode === "light" ? "light" : "dark";
    try {
      Services.prefs.setCharPref("exotic.theme.mode", next);
    } catch (_) {}

    syncWebsiteThemeEngine();
    syncAllWindows();
  }

  function toggleExoticTheme() {
    applyExoticTheme(getThemeMode() === "dark" ? "light" : "dark");
  }

  // ---------------------------------------------------------------------------
  // 3. Register `resource://exotic-assets/` & Load Custom Exotic Surfaces
  // ---------------------------------------------------------------------------
  const greDir = Services.dirsvc.get("GreD", Ci.nsIFile);
  const assetsDir = greDir.clone();
  assetsDir.append("exotic-assets");

  try {
    const resProto = Services.io
      .getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler);
    resProto.setSubstitution("exotic-assets", Services.io.newFileURI(assetsDir));
  } catch (_) {}

  try {
    ChromeUtils.registerWindowActor("ExoticWebsiteTheme", {
      parent: {
        esModuleURI:
          "resource://exotic-assets/ExoticWebsiteThemeParent.sys.mjs",
      },
      child: {
        esModuleURI:
          "resource://exotic-assets/ExoticWebsiteThemeChild.sys.mjs",
        events: {
          DOMWindowCreated: { capture: true },
          DOMDocElementInserted: { capture: true },
          DOMContentLoaded: {},
          pageshow: {},
          play: { capture: true },
          playing: { capture: true },
          ExoticSetTheme: { wantUntrusted: true },
          ExoticOpenMods: { wantUntrusted: true },
          ExoticNavigate: { wantUntrusted: true },
        },
      },
      allFrames: true,
      safeForUntrustedWebProcess: true,
    });
  } catch (actorErr) {
    console.error("[Exotic Actor Registration Error]", actorErr);
  }

  // Pure Ad, Analytics & Telemetry Collector Host Filter (never touches Cloudflare,
  // image/video/avatar CDNs, icon fonts, or first-party assets)
  const PURE_TRACKER_SUFFIXES = [
    "google-analytics.com",
    "googletagmanager.com",
    "googlesyndication.com",
    "doubleclick.net",
    "googleadservices.com",
    "adservice.google.com",
    "analytics.tiktok.com",
    "ads-twitter.com",
    "amazon-adsystem.com",
    "scorecardresearch.com",
    "quantserve.com",
    "criteo.com",
    "criteo.net",
    "taboola.com",
    "outbrain.com",
    "adnxs.com",
    "rubiconproject.com",
    "pubmatic.com",
    "openx.net",
    "clarity.ms",
    "hotjar.com",
    "mixpanel.com",
    "mxpnl.com",
    "segment.io",
    "segment.com",
    "amplitude.com",
    "mouseflow.com",
    "fullstory.com",
    "luckyorange.com",
    "bat.bing.com",
    "nr-data.net",
  ];

  function isPureTrackerRequest(host, path) {
    if (!host) return false;
    const h = host.toLowerCase();
    if (h === "connect.facebook.net") {
      const p = (path || "").toLowerCase();
      return p.includes("fbevents") || p.includes("/signals/");
    }
    for (let i = 0; i < PURE_TRACKER_SUFFIXES.length; i++) {
      const suf = PURE_TRACKER_SUFFIXES[i];
      if (h === suf || h.endsWith("." + suf)) {
        return true;
      }
    }
    return false;
  }

  // Send Exotic Engine Client Hints on document navigations & enforce subresource tracker shield
  try {
    Services.obs.addObserver(
      {
        observe(subject, topic) {
          if (topic !== "http-on-modify-request") return;
          try {
            const ch = subject.QueryInterface(Ci.nsIHttpChannel);
            const uri = ch.URI;
            if (!uri) return;
            const scheme = uri.scheme || "";
            if (scheme !== "https" && scheme !== "http") return;

            const loadInfo = ch.loadInfo;
            const cpType = loadInfo
              ? loadInfo.externalContentPolicyType
              : Ci.nsIContentPolicy.TYPE_OTHER;
            const isDocNav =
              cpType === Ci.nsIContentPolicy.TYPE_DOCUMENT ||
              cpType === Ci.nsIContentPolicy.TYPE_SUBDOCUMENT;

            // Never cancel top-level or iframe document navigations; only filter subresource telemetry
            if (
              !isDocNav &&
              exoticState.shieldEnabled &&
              isPureTrackerRequest(uri.asciiHost || "", uri.filePath || "")
            ) {
              exoticState.blockedCount += 1;
              ch.cancel(Cr.NS_ERROR_ABORT);
              return;
            }

            // Only attach Sec-CH-UA* headers on HTTPS document/iframe loads so cross-origin
            // CORS subresources (CDNs, fonts, <script crossorigin="anonymous">) are untouched
            if (scheme === "https" && isDocNav) {
              ch.setRequestHeader("Sec-CH-UA", EXOTIC_CH_BRANDS, false);
              ch.setRequestHeader("Sec-CH-UA-Full-Version", '"159.0.0.0"', false);
              ch.setRequestHeader(
                "Sec-CH-UA-Full-Version-List",
                EXOTIC_CH_FULL_BRANDS,
                false
              );
              ch.setRequestHeader("Sec-CH-UA-Mobile", "?0", false);
              ch.setRequestHeader("Sec-CH-UA-Model", '""', false);
              ch.setRequestHeader(
                "Sec-CH-UA-Platform",
                '"' + EXOTIC_CH_PLATFORM + '"',
                false
              );
              ch.setRequestHeader(
                "Sec-CH-UA-Platform-Version",
                '"' + EXOTIC_CH_PLATFORM_VER + '"',
                false
              );
              ch.setRequestHeader(
                "Sec-CH-UA-Arch",
                '"' + EXOTIC_CH_ARCH + '"',
                false
              );
              ch.setRequestHeader("Sec-CH-UA-Bitness", '"64"', false);
              ch.setRequestHeader("Sec-CH-Bitness", '"64"', false);
              if (getModBool("exotic.mods.syncWebsiteTheme", false)) {
                const schemeHdr = getThemeMode() === "dark" ? '"dark"' : '"light"';
                ch.setRequestHeader("Sec-CH-Prefers-Color-Scheme", schemeHdr, false);
              }
            }
          } catch (_) {}
        },
      },
      "http-on-modify-request"
    );

    Services.obs.addObserver(
      {
        observe(subject, topic) {
          if (topic !== "http-on-examine-response") return;
          try {
            if (!getModBool("exotic.mods.liveTranscriber", false)) return;
            const ch = subject.QueryInterface(Ci.nsIHttpChannel);
            const loadInfo = ch.loadInfo;
            const cpType = loadInfo
              ? loadInfo.externalContentPolicyType
              : Ci.nsIContentPolicy.TYPE_OTHER;
            if (cpType !== Ci.nsIContentPolicy.TYPE_MEDIA) return;
            let hasAcao = false;
            try {
              hasAcao = Boolean(ch.getResponseHeader("Access-Control-Allow-Origin"));
            } catch (_) {}
            if (!hasAcao) {
              ch.setResponseHeader("Access-Control-Allow-Origin", "*", false);
            }
          } catch (_) {}
        },
      },
      "http-on-examine-response"
    );
  } catch (_) {}

  applyExoticTheme(getThemeMode());
  syncExoticMods();
  try {
    let syncingThemePref = false;
    Services.prefs.addObserver("exotic.mods.", {
      observe(_subject, _topic, data) {
        if (
          data === "exotic.mods.managedSiteCookies" ||
          data === "exotic.mods.halloweenX" ||
          data === "exotic.mods.halloweenY"
        ) {
          return;
        }
        syncExoticMods();
      },
    });
    Services.prefs.addObserver("exotic.privacy.", {
      observe() {
        syncExoticMods();
      },
    });
    Services.prefs.addObserver("exotic.theme.mode", {
      observe() {
        if (syncingThemePref) return;
        syncingThemePref = true;
        try {
          syncWebsiteThemeEngine();
          syncAllWindows();
        } finally {
          syncingThemePref = false;
        }
      },
    });
  } catch (_) {}

  const newtabFile = assetsDir.clone();
  newtabFile.append("newtab.html");
  let newtabURI = "about:blank";
  if (newtabFile.exists()) {
    newtabURI = Services.io.newFileURI(newtabFile).spec;
    defaultPref("browser.startup.page", 1);
    defaultPref("browser.startup.homepage", newtabURI);
    try {
      const { AboutNewTab } = ChromeUtils.importESModule(
        "resource:///modules/AboutNewTab.sys.mjs"
      );
      AboutNewTab.newTabURL = newtabURI;
    } catch (_) {
      Services.obs.addObserver(function onDelayed() {
        Services.obs.removeObserver(onDelayed, "browser-delayed-startup-finished");
        try {
          const { AboutNewTab } = ChromeUtils.importESModule(
            "resource:///modules/AboutNewTab.sys.mjs"
          );
          AboutNewTab.newTabURL = newtabURI;
        } catch (_) {}
      }, "browser-delayed-startup-finished");
    }
  }

  const shellScriptURI = "resource://exotic-assets/exotic-shell.js";
  const welcomeScriptURI = "resource://exotic-assets/exotic-welcome.js";
  const halloweenScriptURI = "resource://exotic-assets/exotic-halloween.js";
  const transcriberScriptURI = "resource://exotic-assets/exotic-transcriber.js";
  const osScriptURI = "resource://exotic-assets/exotic-os.js";
  const studioScriptURI = "resource://exotic-assets/settings-studio.js";
  const pagesScriptURI = "resource://exotic-assets/exotic-pages.js";

  try {
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(
      Ci.nsIStyleSheetService
    );
    const f = assetsDir.clone();
    f.append("userContent.css");
    if (f.exists()) {
      const uri = Services.io.newFileURI(f);
      if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
        sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
      }
    }
  } catch (_) {}

  Services.obs.addObserver(function onProfileReady() {
    Services.obs.removeObserver(onProfileReady, "profile-after-change");
    try {
      runProfileCleanWebMigration(true);
      exoticState.shieldEnabled = getModBool("exotic.shield.enabled", true);

      const profDir = Services.dirsvc.get("ProfD", Ci.nsIFile);
      const chromeDir = profDir.clone();
      chromeDir.append("chrome");
      if (!chromeDir.exists()) {
        chromeDir.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
      }
      for (const name of ["userChrome.css", "userContent.css"]) {
        const src = assetsDir.clone();
        src.append(name);
        const dst = chromeDir.clone();
        dst.append(name);
        if (src.exists()) {
          if (dst.exists()) dst.remove(false);
          src.copyTo(chromeDir, name);
        }
      }
      syncExoticMods();
    } catch (_) {}
  }, "profile-after-change");

  // ---------------------------------------------------------------------------
  // 4. Standard Tracking Protection State (Never Cancels Website Image/Script Loads)
  // ---------------------------------------------------------------------------
  const exoticBridge = {
    applyTheme: applyExoticTheme,
    syncAllWindows,
    syncMods: syncExoticMods,
    notifyRouteChanged: () => syncAllWindows(),
    getShieldEnabled: () => exoticState.shieldEnabled,
    setShieldEnabled: (val) => {
      exoticState.shieldEnabled = !!val;
      try {
        Services.prefs.setBoolPref("exotic.shield.enabled", !!val);
      } catch (_) {}
      syncExoticMods();
    },
    getBlockedCount: () => exoticState.blockedCount,
  };

  const LEGACY_REDIRECT_MAP = [
    { prefix: "about:addons", section: "mods" },
    { prefix: "about:plugins", section: "mods" },
    { prefix: "about:config", section: "flags" },
    { prefix: "about:support", section: "flags" },
    { prefix: "about:about", section: "flags" },
    { prefix: "about:telemetry", section: "flags" },
    { prefix: "about:downloads", section: "downloads" },
    { prefix: "about:protections", section: "privacy" },
    { prefix: "about:firefoxview", section: "history" },
    { prefix: "about:welcome", section: "appearance" },
  ];

  function handleInternalDocument(win) {
    try {
      if (!win || !win.location) return;
      const href = win.location.href || "";

      for (const rule of LEGACY_REDIRECT_MAP) {
        if (href.startsWith(rule.prefix)) {
          try {
            Services.prefs.setStringPref("exotic.studio.openSection", rule.section);
          } catch (_) {}
          win.location.replace("about:preferences");
          return;
        }
      }

      if (href.startsWith("about:privatebrowsing") || href.startsWith("about:neterror")) {
        Services.scriptloader.loadSubScript(pagesScriptURI, win);
        return;
      }

      if (
        href.startsWith("about:preferences") ||
        href.includes("/preferences/preferences.xhtml")
      ) {
        if (win.__exoticSettingsMounted) return;
        win.__exoticBridge = exoticBridge;
        Services.scriptloader.loadSubScript(studioScriptURI, win);
        const refreshHook = () => {
          try {
            if (win && !win.closed && typeof win.__exoticRefreshSettings === "function") {
              win.__exoticRefreshSettings();
            }
          } catch (_) {}
        };
        exoticState.windowSyncHooks.add(refreshHook);
        win.addEventListener(
          "unload",
          () => exoticState.windowSyncHooks.delete(refreshHook),
          { once: true }
        );
      }
    } catch (e) {
      console.error("[Exotic Studio Mount Error]", e);
    }
  }

  Services.obs.addObserver(
    {
      observe(subject) {
        const win = subject;
        if (!win || !win.addEventListener) return;
        win.addEventListener("DOMContentLoaded", () => handleInternalDocument(win), {
          once: true,
        });
      },
    },
    "chrome-document-global-created"
  );

  // ---------------------------------------------------------------------------
  // 5. Mount Custom Exotic Browser Shell (`browser.xhtml`)
  // ---------------------------------------------------------------------------
  function mountCustomBrowserShell(win) {
    try {
      if (!win || win.__exoticWindowController) return;
      win.__exoticWindowController = {
        applyTheme: applyExoticTheme,
        toggleTheme: toggleExoticTheme,
        getThemeMode,
        countEnabledMods,
        getShieldEnabled: () => exoticState.shieldEnabled,
        setShieldEnabled: (val) => exoticBridge.setShieldEnabled(val),
        getBlockedCount: () => exoticState.blockedCount,
        syncMods: () => syncExoticMods(),
        toggleSidebarMode: () => {
          try {
            const cur = Services.prefs.getCharPref("exotic.ui.sidebarMode", "expanded");
            Services.prefs.setCharPref(
              "exotic.ui.sidebarMode",
              cur === "collapsed" ? "expanded" : "collapsed"
            );
          } catch (_) {}
          syncAllWindows();
        },
        toggleCompactMode: () => {
          try {
            const cur = Services.prefs.getBoolPref("exotic.ui.compact", false);
            Services.prefs.setBoolPref("exotic.ui.compact", !cur);
          } catch (_) {}
          syncAllWindows();
        },
        setWorkspace: (wsId) => {
          try {
            Services.prefs.setCharPref("exotic.ui.workspace", wsId || "personal");
          } catch (_) {}
          syncAllWindows();
        },
        openStartTab: () => {
          try {
            win.gBrowser.selectedTab = win.gBrowser.addTab(newtabURI, {
              triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
            });
          } catch (_) {}
        },
        registerWindowSync: (fn) => exoticState.windowSyncHooks.add(fn),
        unregisterWindowSync: (fn) => exoticState.windowSyncHooks.delete(fn),
      };
      Services.scriptloader.loadSubScript(shellScriptURI, win);
      try {
        Services.scriptloader.loadSubScript(welcomeScriptURI, win);
      } catch (welcomeErr) {
        console.error("[Exotic Welcome Mount Error]", welcomeErr);
      }
      try {
        Services.scriptloader.loadSubScript(halloweenScriptURI, win);
      } catch (halloweenErr) {
        console.error("[Exotic Halloween Mount Error]", halloweenErr);
      }
      try {
        Services.scriptloader.loadSubScript(transcriberScriptURI, win);
      } catch (transcriberErr) {
        console.error("[Exotic Transcriber Mount Error]", transcriberErr);
      }
      try {
        Services.scriptloader.loadSubScript(osScriptURI, win);
      } catch (osErr) {
        console.error("[Exotic ExOS Mount Error]", osErr);
      }
    } catch (e) {
      console.error("[Exotic Shell Mount Error]", e);
    }
  }

  Services.obs.addObserver(
    {
      observe(subject) {
        const win = subject;
        if (!win || !win.addEventListener) return;
        win.addEventListener(
          "load",
          () => {
            try {
              if (
                win.location &&
                win.location.href === "chrome://browser/content/browser.xhtml"
              ) {
                mountCustomBrowserShell(win);
              }
            } catch (_) {}
          },
          { once: true }
        );
      },
    },
    "domwindowopened"
  );
} catch (err) {
  console.error("[Exotic Engine Init Error]", err);
}
