  function runProfileCleanWebMigration(clearStaleCookies) {
    try {
      if (!Services.prefs.getBoolPref("exotic.privacy.hardenedV9", false)) {
        for (const stalePref of STALE_RENDERING_PREFS) {
          try {
            if (Services.prefs.prefHasUserValue(stalePref)) {
              Services.prefs.clearUserPref(stalePref);
            }
          } catch (_) {}
        }
        Services.prefs.setStringPref("general.useragent.override", EXOTIC_UA);
        Services.prefs.setBoolPref("exotic.shield.enabled", true);
        Services.prefs.setBoolPref("exotic.mods.webrtcCloak", true);
        Services.prefs.setBoolPref("privacy.trackingprotection.enabled", false);
        Services.prefs.setBoolPref("privacy.fingerprintingProtection", true);
        Services.prefs.setStringPref(
          "privacy.fingerprintingProtection.overrides",
          EXOTIC_FPP_OVERRIDES
        );
        Services.prefs.setBoolPref("privacy.globalprivacycontrol.enabled", true);
        Services.prefs.setBoolPref("privacy.donottrackheader.enabled", true);
        Services.prefs.setBoolPref("webgl.enable-debug-renderer-info", false);
        Services.prefs.setIntPref("network.cookie.cookieBehavior", 5);
        if (clearStaleCookies) {
          const expiredTs = Date.now() - 86400000;
          const oneYearExpiry = Date.now() + 31536000000;
          try {
            const yt = getHostCookieValue("youtube.com", "PREF");
            if (yt && yt.includes("f6=")) {
              const cleaned = yt.split("&").filter((p) => p && !p.startsWith("f6=")).join("&");
              setHttpsLaxCookie(".youtube.com", "PREF", cleaned, cleaned ? oneYearExpiry : expiredTs);
            }
          } catch (_) {}
          try {
            const bg = getHostCookieValue("bing.com", "SRCHHPGUSR");
            if (bg && (bg.includes("WEBTHEME=") || bg.includes("PREFCOL="))) {
              const cleaned = bg
                .split("&")
                .filter((p) => p && !p.startsWith("WEBTHEME=") && !p.startsWith("PREFCOL="));
              cleaned.push("WEBTHEME=2");
              setHttpsLaxCookie(".bing.com", "SRCHHPGUSR", cleaned.join("&"), oneYearExpiry);
            }
          } catch (_) {}
          for (const [host, cname] of [
            [".reddit.com", "theme"],
            [".huggingface.co", "theme"],
            [".x.com", "night_mode"],
            [".twitter.com", "night_mode"],
            [".duckduckgo.com", "ae"],
          ]) {
            try {
              setHttpsLaxCookie(host, cname, "", expiredTs);
            } catch (_) {}
          }
          Services.prefs.setBoolPref("exotic.mods.managedSiteCookies", false);
          Services.prefs.setBoolPref("exotic.rendering.cleanWebV7", true);
          Services.prefs.setBoolPref("exotic.privacy.hardenedV8", true);
          Services.prefs.setBoolPref("exotic.privacy.hardenedV9", true);
        }
      }
    } catch (_) {}
