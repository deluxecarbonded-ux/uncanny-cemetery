  try {
    exoticState.shieldEnabled = Services.prefs.getBoolPref("exotic.shield.enabled");
  } catch (_) {}

  const MOD_PREF_KEYS = [
    "exotic.mods.liveTranscriber",
    "exotic.mods.halloweenCompanion",
    "exotic.mods.exos",
    "exotic.mods.syncWebsiteTheme",
    "exotic.mods.hideDiscordServers",
